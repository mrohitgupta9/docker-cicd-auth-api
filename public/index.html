<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSafe App - Threat Scanner Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wider text-cyan-400 flex items-center gap-2">
        🛡️ CyberSafe <span class="text-xs bg-cyan-900 text-cyan-300 px-2 py-0.5 rounded border border-cyan-700">Live Engine</span>
      </h1>
      <div id="authStatus" class="text-sm font-medium text-slate-400">
        Status: <span class="text-red-400">Not Logged In</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Auth Section (Left Panel) -->
    <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
      <h2 class="text-xl font-bold mb-4 text-cyan-400 border-b border-slate-700 pb-2">1. Authentication</h2>
      
      <!-- Login / Register Form -->
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400">Email Address</label>
          <input type="email" id="authEmail" placeholder="user@example.com" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="text-xs text-slate-400">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
        
        <div class="flex gap-2 pt-2">
          <button onclick="handleLogin()" class="w-1/2 bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 rounded text-sm transition">Login</button>
          <button onclick="handleRegister()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded text-sm transition">Register</button>
        </div>
      </div>

      <!-- Token Viewer -->
      <div class="mt-6">
        <label class="text-xs text-slate-400">JWT Access Token</label>
        <textarea id="tokenBox" readonly placeholder="Login to receive active JWT Token..." class="w-full h-24 bg-slate-950 border border-slate-800 rounded p-2 text-xs font-mono text-cyan-300 resize-none mt-1"></textarea>
      </div>
    </section>

    <!-- CyberSafe Tools (Right Panel - 2 Cols) -->
    <section class="md:col-span-2 space-y-6">

      <!-- Tool 1: Phishing URL Scanner -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
        <h3 class="text-lg font-bold text-cyan-400 mb-2 flex items-center gap-2">🔗 Phishing Link Scanner</h3>
        <p class="text-xs text-slate-400 mb-4">Paste any suspicious URL to check for scam patterns.</p>
        <div class="flex gap-2">
          <input type="text" id="scanUrlInput" placeholder="http://claim-gift-free-money.com" class="flex-1 bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          <button onclick="scanURL()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-4 py-2 rounded text-sm transition">Scan URL</button>
        </div>
        <div id="urlResult" class="mt-3 text-sm hidden p-3 rounded border"></div>
      </div>

      <!-- Tool 2: Spam Search & Scammer Reporting -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
        <h3 class="text-lg font-bold text-cyan-400 mb-2 flex items-center gap-2">🚨 Scammer Search & Report</h3>
        
        <!-- Search Box -->
        <div class="mb-4">
          <label class="text-xs text-slate-400 mb-1 block">Check Phone / UPI ID / URL in Scammer Database</label>
          <div class="flex gap-2">
            <input type="text" id="spamQueryInput" placeholder="Enter phone number or UPI ID" class="flex-1 bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            <button onclick="searchSpam()" class="bg-amber-600 hover:bg-amber-500 text-white font-medium px-4 py-2 rounded text-sm transition">Search Database</button>
          </div>
          <div id="spamSearchResult" class="mt-3 text-sm hidden p-3 rounded border"></div>
        </div>

        <hr class="border-slate-700 my-4">

        <!-- Report Box -->
        <div class="space-y-3">
          <h4 class="text-xs font-bold text-slate-300 uppercase">Report New Scammer Entity</h4>
          <div class="grid grid-cols-2 gap-2">
            <select id="reportType" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
              <option value="PHONE">Phone Number</option>
              <option value="UPI">UPI ID</option>
              <option value="URL">URL Link</option>
            </select>
            <input type="text" id="reportValue" placeholder="e.g. 9876543210" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
          </div>
          <input type="text" id="reportDesc" placeholder="Description of the scam incident" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
          <button onclick="reportThreat()" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded text-sm transition">Submit Threat Report</button>
        </div>
      </div>

    </section>

  </main>

  <script>
    let token = localStorage.getItem('cybersafe_token') || '';

    // Initialize UI
    if (token) {
      document.getElementById('tokenBox').value = token;
      document.getElementById('authStatus').innerHTML = 'Status: <span class="text-emerald-400">Authenticated ✅</span>';
    }

    async function handleLogin() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          token = data.token;
          localStorage.setItem('cybersafe_token', token);
          document.getElementById('tokenBox').value = token;
          document.getElementById('authStatus').innerHTML = 'Status: <span class="text-emerald-400">Authenticated ✅</span>';
          alert('Login Successful!');
        } else {
          alert('Login Failed: ' + data.message);
        }
      } catch (err) {
        alert('Error connecting to backend API');
      }
    }

    async function handleRegister() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Cyber User', email, password })
        });
        const data = await res.json();

        if (res.ok) {
          alert('Registration Successful! Please Click Login.');
        } else {
          alert('Registration Failed: ' + data.message);
        }
      } catch (err) {
        alert('Error connecting to backend API');
      }
    }

    async function scanURL() {
      if (!token) return alert('Please Login first to get JWT token!');
      const url = document.getElementById('scanUrlInput').value;
      const resBox = document.getElementById('urlResult');

      const res = await fetch('/api/cyber/check-url', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      resBox.classList.remove('hidden');
      if (data.status.includes('DANGER')) {
        resBox.className = 'mt-3 text-sm p-3 rounded border border-red-500 bg-red-950/50 text-red-300';
      } else {
        resBox.className = 'mt-3 text-sm p-3 rounded border border-emerald-500 bg-emerald-950/50 text-emerald-300';
      }
      resBox.innerHTML = `<strong>Status:</strong> ${data.status}<br><strong>Message:</strong> ${data.message}`;
    }

    async function searchSpam() {
      if (!token) return alert('Please Login first to get JWT token!');
      const query = document.getElementById('spamQueryInput').value;
      const resBox = document.getElementById('spamSearchResult');

      const res = await fetch(`/api/cyber/check-spam?query=${encodeURIComponent(query)}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      resBox.classList.remove('hidden');
      if (data.totalReports > 0) {
        resBox.className = 'mt-3 text-sm p-3 rounded border border-red-500 bg-red-950/50 text-red-300';
        resBox.innerHTML = `<strong>Alert:</strong> ${data.status}<br><strong>Total User Reports:</strong> ${data.totalReports}`;
      } else {
        resBox.className = 'mt-3 text-sm p-3 rounded border border-emerald-500 bg-emerald-950/50 text-emerald-300';
        resBox.innerHTML = `<strong>Status:</strong> ${data.status}<br><strong>Details:</strong> ${data.message}`;
      }
    }

    async function reportThreat() {
      if (!token) return alert('Please Login first to get JWT token!');
      const type = document.getElementById('reportType').value;
      const value = document.getElementById('reportValue').value;
      const description = document.getElementById('reportDesc').value;

      const res = await fetch('/api/cyber/report-threat', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ type, value, description })
      });

      if (res.ok) {
        alert('Threat Reported Successfully to Database!');
      } else {
        alert('Failed to report threat');
      }
    }
  </script>
</body>
</html>
